<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mana Prod | Dashboard</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A1013">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='54.830' cy='52.898' r='38.640' fill='%23060A0C'/%3E%3Cpath fill-rule='evenodd' fill='%232EC4CF' d='M4.000,50.000A46.000,46.000 0 1 0 96.000,50.000A46.000,46.000 0 1 0 4.000,50.000ZM16.190,52.898A38.640,38.640 0 1 0 93.470,52.898A38.640,38.640 0 1 0 16.190,52.898Z'/%3E%3Ccircle cx='16.126' cy='29.676' r='5.457' fill='%23FFFFFF'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A1013; --bg2:#10191D; --bg3:#18262C; --line:#223239;
  --text:#EDF2F3; --muted:#8FA3A8; --teal:#2EC4CF; --teal-hi:#5AD6DF; --ink:#04161A; --danger:#FF7A6B;
  --f:'Schibsted Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;
  --gut:clamp(20px,4vw,64px); --max:1480px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 18px/1.55 var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
p{margin:0}
svg.i{width:1em;height:1em;flex:none}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding-inline:var(--gut)}
.small{font-size:14px;color:var(--muted)}
.title{font-size:clamp(40px,6.8vw,112px);font-weight:800;letter-spacing:-.035em;line-height:.98}
.lede{font-size:clamp(22px,2.3vw,34px);font-weight:500;line-height:1.28;letter-spacing:-.01em;text-wrap:pretty}
.lnk{display:inline-flex;align-items:center;gap:22px;padding-left:22px;font-weight:600;font-size:16px;text-decoration:none;border:1px solid var(--line);transition:border-color .25s,background .25s}
.lnk svg.i{width:52px;height:52px;padding:17px;background:var(--text);color:var(--ink);transition:background .25s}
.lnk:hover{border-color:var(--teal)}
.lnk:hover svg.i{background:var(--teal)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 24px;border-radius:0;border:1px solid transparent;font:600 15px/1 var(--f);text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.btn--solid{background:var(--teal);color:var(--ink)}
.btn--solid:hover{background:var(--teal-hi)}
.btn--line{border-color:var(--line);color:var(--text);background:transparent}
.btn--line:hover{border-color:var(--teal);color:var(--teal)}
.btn--sm{padding:11px 16px;font-size:14px}
.btn--danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn--danger:hover{background:var(--danger);color:var(--ink)}

.hdr{position:fixed;inset:0 0 auto 0;z-index:40;padding-block:20px;transition:background .3s,border-color .3s;border-bottom:1px solid transparent}
.hdr.solid,.hdr.stuck{background:rgba(10,16,19,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom-color:var(--line)}
.hdr__in{display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{display:block;width:clamp(150px,13vw,196px);color:#fff;flex:none}
.logo svg{width:100%;height:auto;display:block}
.nav{display:flex;align-items:center;gap:clamp(22px,3vw,48px);font-size:15px;font-weight:500}
.nav a{text-decoration:none;color:var(--muted);padding-block:6px;border-bottom:1px solid transparent;transition:color .2s}
.nav a:hover{color:var(--text)}
.nav a[aria-current="page"]{color:var(--text);border-bottom-color:var(--teal)}
.burger{display:none;place-items:center;width:44px;height:44px;background:none;border:1px solid var(--line);border-radius:0;font-size:22px}
@media(max-width:820px){
  .burger{display:grid;position:relative;z-index:2}
  .nav{position:fixed;inset:0;background:var(--bg);flex-direction:column;align-items:flex-start;justify-content:center;gap:22px;padding:0 var(--gut);font-size:clamp(34px,10vw,52px);font-weight:800;letter-spacing:-.03em;display:none}
  .hdr.open .nav{display:flex}
}

.hero{position:relative;height:100vh;height:100svh;min-height:560px;display:flex;align-items:flex-end;overflow:hidden;background:#000}
.hero__media{position:absolute;inset:0;overflow:hidden}
.hero__media iframe{position:absolute;top:50%;left:50%;width:max(100vw,177.78vh);height:max(56.25vw,100vh);transform:translate(-50%,-50%);border:0;pointer-events:none}
.hero__stage{position:absolute;inset:0;background:var(--bg2)}
.hero__shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,16,19,.9) 0%,rgba(10,16,19,.15) 50%,rgba(10,16,19,.45) 100%)}
.hero__in{position:relative;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:32px;padding-bottom:clamp(32px,5vw,64px)}
.hero__txt{flex:1 1 560px;min-width:0;display:flex;flex-direction:column;gap:18px}
.hero__txt .small{color:#C5D3D6}
.hero__h{font-size:clamp(28px,3.9vw,60px);font-weight:700;line-height:1.08;letter-spacing:-.025em;max-width:19em}
.reel{display:inline-flex;align-items:center;gap:18px;background:none;border:0;padding:0;text-align:left;text-decoration:none}
.reel__i{display:grid;place-items:center;width:60px;height:60px;border:1px solid var(--text);font-size:20px;transition:background .2s,color .2s}
.reel:hover .reel__i{background:var(--text);color:var(--ink)}
.reel span.t{font-weight:600;line-height:1.25}
.reel small{display:block;font-size:14px;font-weight:400;color:#C5D3D6}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero__h .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.14em;margin-bottom:-.14em}
.hero__h .w>span{display:inline-block;transform:translateY(112%);animation:up 1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(.3s + var(--i)*.06s)}
@keyframes up{to{transform:none}}
.hero__stage{overflow:hidden;background:radial-gradient(120% 90% at 80% 10%,#16262c 0%,#0d161a 55%,#0a1013 100%)}
.hero__stage .glow{position:absolute;width:70vmax;height:70vmax;left:55%;top:-20%;border-radius:50%;background:radial-gradient(closest-side,rgba(46,196,207,.28),rgba(46,196,207,0) 70%);filter:blur(10px);animation:drift 16s ease-in-out infinite alternate}
.hero__stage .wm{position:absolute;right:-6vw;top:50%;width:min(58vw,820px);transform:translateY(-58%);color:#fff;opacity:.06}
.hero__stage .wm svg{width:100%;height:auto;display:block}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(-18vw,16vh) scale(1.25)}}
main{animation:pageIn .65s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tile__pv{position:absolute;inset:0;overflow:hidden;opacity:0;transition:opacity .5s;pointer-events:none;background:#000}
.tile__pv.on{opacity:1}
.tile__pv iframe{position:absolute;top:50%;left:50%;height:100%;aspect-ratio:16/9;width:auto;border:0;transform:translate(-50%,-50%) scale(1.06)}
.tile__tag{position:absolute;left:14px;bottom:14px;z-index:2;display:inline-flex;align-items:center;gap:8px;background:var(--text);color:var(--ink);font:600 13px/1 var(--f);padding:9px 12px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;pointer-events:none}
.tile:hover .tile__tag{opacity:1;transform:none}
@media(hover:none){.tile__tag{display:none}}
.hero__txt>:nth-child(2){animation-delay:.1s}
.hero__act{animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.sec{padding-block:clamp(64px,9vw,140px)}
.row2{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:24px clamp(32px,6vw,120px);padding-block:clamp(40px,5vw,76px);border-top:1px solid var(--line)}
.row2>h2{font-size:clamp(20px,1.8vw,26px);letter-spacing:-.01em}
.row2--first{border-top:0}
.head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:16px 32px;margin-bottom:clamp(28px,4vw,56px)}
.head h2{font-size:clamp(28px,3.4vw,52px);font-weight:800;letter-spacing:-.03em}
@media(max-width:820px){.row2{grid-template-columns:1fr}}
.clients{font-size:clamp(20px,2.2vw,30px);font-weight:500;line-height:1.4;letter-spacing:-.01em}
.cta{padding-block:clamp(80px,12vw,180px);border-top:1px solid var(--line)}
.cta a.big{display:inline-flex;align-items:center;gap:.3em;font-size:clamp(34px,7.4vw,124px);font-weight:800;letter-spacing:-.04em;line-height:1;text-decoration:none;transition:color .25s;text-wrap:balance}
.cta a.big:hover{color:var(--teal)}
.cta p{margin-top:28px}

.flt{display:flex;flex-wrap:wrap;gap:6px 28px;margin-top:clamp(32px,4vw,56px)}
.flt button{background:none;border:0;border-bottom:1px solid transparent;padding:6px 0;color:var(--muted);font:500 15px/1.3 var(--f);transition:color .2s}
.flt button:hover{color:var(--text)}
.flt button[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:clamp(40px,5vw,80px) clamp(16px,2vw,32px);align-items:start}
.tile{grid-column:span 6;display:block;text-decoration:none;min-width:0}
.grid--ed .tile:nth-child(4n+1){grid-column:span 7}
.grid--ed .tile:nth-child(4n+2){grid-column:span 5}
.grid--ed .tile:nth-child(4n+3){grid-column:span 5}
.grid--ed .tile:nth-child(4n+4){grid-column:span 7}
.page .grid{margin-top:clamp(32px,4vw,56px)}
.tile__img{position:relative;aspect-ratio:16/10;background:var(--bg2);overflow:hidden}
.tile__img img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.tile:hover .tile__img img{transform:scale(1.035)}
.dlv{list-style:none;margin:0;padding:0;max-width:44em}
.dlv li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding-block:14px;border-top:1px solid var(--line);font-size:19px;font-weight:500}
.dlv li:last-child{border-bottom:1px solid var(--line)}
.dlv .n{color:var(--teal);font-weight:700;font-size:14px;padding-top:4px}
.proj__ctx{max-width:40em;color:#C5D3D6;font-size:clamp(19px,1.6vw,22px)}
.rcount{margin-top:20px;color:var(--muted)}
.clg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:0;border-left:1px solid var(--line);border-top:1px solid var(--line)}
.clg>div{display:grid;place-items:center;height:104px;padding:18px 22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;font-weight:600;font-size:17px;letter-spacing:-.01em;color:#C5D3D6}
.clg img{max-width:100%;max-height:100%;object-fit:contain;filter:grayscale(1);opacity:.85;transition:opacity .2s,filter .2s}
.clg>div:hover img{filter:none;opacity:1}
.clg img.wh,.logo-img.wh{filter:brightness(0) invert(1);opacity:.85}
.clg>div:hover img.wh{filter:brightness(0) invert(1);opacity:1}
.mq{overflow:hidden;border-block:1px solid var(--line);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq__t{display:flex;width:max-content;animation:mq var(--d,40s) linear infinite}
.mq:hover .mq__t{animation-play-state:paused}
.mq__s{display:flex;flex:none}
.mq__i{flex:none;display:grid;place-items:center;height:clamp(88px,9vw,124px);padding-inline:clamp(32px,5vw,72px);font-weight:700;font-size:clamp(20px,2.2vw,30px);letter-spacing:-.02em;color:var(--muted);white-space:nowrap;transition:color .25s}
.mq__i:hover{color:var(--text)}
.mq__i img{height:clamp(34px,4vw,52px);width:auto;max-width:200px;object-fit:contain;filter:grayscale(1);opacity:.7;transition:opacity .25s,filter .25s}
.mq__i img.wh{filter:brightness(0) invert(1);opacity:.7}
.mq__i:hover img{filter:none;opacity:1}
.mq__i:hover img.wh{filter:brightness(0) invert(1);opacity:1}
@keyframes mq{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){
  .mq{-webkit-mask-image:none;mask-image:none}
  .mq__t{animation:none;width:auto;flex-wrap:wrap}
  .mq__s{flex-wrap:wrap;justify-content:center}
  .mq__s[aria-hidden="true"]{display:none}
}
.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:36px 24px}
.member__img{aspect-ratio:4/5;background:var(--bg2);overflow:hidden;position:relative}
.member__img img{width:100%;height:100%;object-fit:cover}
.member__img .ph span{font-size:44px}
.member h3{font-size:20px;letter-spacing:-.01em;margin-top:16px}
.member .role{color:var(--teal);font-size:15px;font-weight:500;margin-top:4px}
.member .bio{color:var(--muted);font-size:15px;margin-top:10px;max-width:30ch}
.cedit{display:grid;grid-template-columns:140px minmax(0,1fr) auto;gap:18px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.cedit:first-child{border-top:0}
.cedit .fld{margin-bottom:10px}
.lbox{width:140px;height:84px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;padding:10px;overflow:hidden}
.logo-img{max-width:100%;max-height:100%;object-fit:contain}
.pbox{width:140px;aspect-ratio:4/5;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.pbox img{width:100%;height:100%;object-fit:cover}
.pbox .ph span{font-size:32px}
.cedit--t{align-items:start}
@media(max-width:760px){.cedit{grid-template-columns:1fr}.cedit .acts{justify-content:flex-start}}
.ph{position:relative;width:100%;height:100%;background:linear-gradient(135deg,#10191D 0%,#1a2b32 100%)}
.ph__p{font-style:normal;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:64px;height:64px;border:1px solid #35505a;color:#4b6872;font-size:20px}
.ph b{position:absolute;left:clamp(14px,1.6vw,24px);bottom:clamp(12px,1.4vw,20px);font-size:clamp(20px,2.6vw,40px);font-weight:800;letter-spacing:-.03em;color:#35505a;line-height:1}
.ph span{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--bg3)}
.tile__cap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;margin-top:16px}
.tile__cap h3{font-size:clamp(18px,1.7vw,24px);letter-spacing:-.01em;transition:color .2s}
.tile:hover h3{color:var(--teal)}
.tile__cap p{font-size:14px;color:var(--muted);margin-top:4px}
.tile__cap .n{font-size:14px;color:var(--muted);white-space:nowrap}
.empty{padding:48px;border:1px dashed var(--line);color:var(--muted);text-align:center;grid-column:1/-1}
@media(max-width:820px){.tile,.grid--ed .tile:nth-child(n){grid-column:span 12}}

.page{padding-top:clamp(128px,14vw,210px);padding-bottom:clamp(72px,10vw,150px)}
.page__intro{max-width:34em;margin-top:clamp(24px,3vw,40px);color:#C5D3D6}
.svc{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px 48px;padding-block:clamp(22px,2.4vw,34px);border-top:1px solid var(--line);align-items:baseline}
.svc:last-child{border-bottom:1px solid var(--line)}
.svc h3{font-size:clamp(24px,3.2vw,46px);letter-spacing:-.025em;transition:color .25s}
.svc:hover h3{color:var(--teal)}
.svc p{color:var(--muted);max-width:36ch}
@media(max-width:760px){.svc{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:28px}
.steps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px}
.steps .num{font-weight:700;color:var(--teal)}
.steps h3{font-size:20px;letter-spacing:-.01em;margin-bottom:6px}
.steps p{color:var(--muted);max-width:46ch}
.why{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px clamp(28px,5vw,80px);margin:0}
.why h3{font-size:20px;letter-spacing:-.01em;margin-bottom:8px}
.why p{color:var(--muted);max-width:40ch}
@media(max-width:640px){.why{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;margin:0}
.facts b{display:block;font-size:clamp(32px,4vw,56px);font-weight:800;letter-spacing:-.035em;line-height:1}
.facts span{display:block;margin-top:8px;font-size:15px;color:var(--muted)}
@media(max-width:700px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prose{display:grid;gap:20px;max-width:40em;color:#C5D3D6}
.gear{margin:0}
.gear div{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr);gap:16px;padding-block:16px;border-bottom:1px solid var(--line)}
.gear div:first-child{border-top:1px solid var(--line)}
.gear dt{color:var(--muted);font-size:15px}
.gear dd{margin:0}

.ct{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(40px,7vw,128px);margin-top:clamp(40px,5vw,72px);align-items:start}
.ct__list{border-bottom:1px solid var(--line)}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;align-items:center;padding-block:22px;border-top:1px solid var(--line)}
.crow .small{grid-column:1/-1}
.crow__v{font-size:clamp(20px,2.1vw,30px);font-weight:600;letter-spacing:-.015em;line-height:1.2;text-decoration:none;word-break:normal;overflow-wrap:break-word;min-width:0;transition:color .2s}
a.crow__v:hover{color:var(--teal)}
.crow__a{display:inline-flex;align-items:center;gap:8px;font:600 14px/1 var(--f);color:var(--text);background:none;border:1px solid var(--line);padding:11px 14px;text-decoration:none;white-space:nowrap;transition:border-color .2s,color .2s}
.crow__a:hover{border-color:var(--teal);color:var(--teal)}
.ct__next{margin-top:36px;display:grid;gap:14px}
.ct__next h2{font-size:15px;letter-spacing:0;font-weight:600;color:var(--muted)}
.ct__next ol{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:n}
.ct__next li{counter-increment:n;display:grid;grid-template-columns:28px minmax(0,1fr);color:#C5D3D6;font-size:16px}
.ct__next li::before{content:counter(n);color:var(--teal);font-weight:700}
.cform{background:var(--bg2);border:1px solid var(--line);padding:clamp(22px,3vw,44px)}
.cform h2{font-size:clamp(22px,2vw,28px);letter-spacing:-.015em;margin-bottom:6px}
.cform .sub2{color:var(--muted);font-size:15px;margin-bottom:26px}
.cform input,.cform select,.cform textarea{background:var(--bg)}
.cform .g2{gap:0 16px}
.cform .btn{width:100%;padding:18px 24px;font-size:16px}
@media(max-width:560px){.crow{grid-template-columns:1fr}.crow__a{justify-self:start}}
.fld{display:flex;flex-direction:column;gap:8px;margin-bottom:18px;min-width:0}
.fld label{font-size:14px;font-weight:500;color:var(--muted)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);padding:13px 14px;border-radius:0;font:400 16px/1.4 var(--f);min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
input[type=checkbox]{width:auto}
textarea{resize:vertical;min-height:130px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.hint{font-size:14px;color:var(--muted);margin-top:10px}
@media(max-width:820px){.ct{grid-template-columns:1fr}}

.ftr{border-top:1px solid var(--line);padding-block:clamp(40px,5vw,72px) 32px}
.ftr__top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:32px 64px}
.ftr .logo{width:180px;margin-bottom:18px}
.ftr .tag{max-width:24em;color:var(--muted);font-size:15px}
.ftr nav{display:flex;flex-direction:column;gap:8px;font-size:15px}
.ftr nav a{text-decoration:none;color:var(--muted)}
.ftr nav a:hover{color:var(--text)}
.ftr__bot{margin-top:48px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.ftr__bot a{color:var(--muted);text-decoration:none}
.ftr__bot a:hover{color:var(--teal)}

.back{display:inline-flex;align-items:center;gap:10px;font-size:15px;font-weight:500;color:var(--muted);text-decoration:none;margin-bottom:clamp(28px,4vw,48px)}
.back:hover{color:var(--teal)}
.proj__h{font-size:clamp(36px,6.4vw,104px);font-weight:800;letter-spacing:-.035em;line-height:.98;max-width:14em}
.meta{display:flex;flex-wrap:wrap;gap:16px clamp(32px,5vw,80px);margin:clamp(28px,4vw,48px) 0 0;padding-top:20px;border-top:1px solid var(--line)}
.meta dt{font-size:14px;color:var(--muted)}
.meta dd{margin:2px 0 0;font-weight:600}
.vid{position:relative;display:block;width:100%;aspect-ratio:16/9;background:var(--bg2);border:0;padding:0;overflow:hidden}
.vid img{width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.vid:hover img{transform:scale(1.025)}
.vid__play{position:absolute;left:clamp(16px,2vw,28px);bottom:clamp(16px,2vw,28px);display:grid;place-items:center;width:64px;height:64px;background:var(--text);color:var(--ink);font-size:22px;transition:background .2s}
.vid:hover .vid__play{background:var(--teal)}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.proj__main{margin-top:clamp(36px,5vw,64px)}
.cap{margin-top:12px;color:var(--muted);font-size:15px}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,3vw,44px) clamp(16px,2vw,32px);margin-top:clamp(28px,3vw,44px)}
.sub{font-size:clamp(22px,2.2vw,30px);margin:clamp(56px,7vw,110px) 0 0}
.photos{columns:3 280px;column-gap:clamp(14px,1.6vw,24px);margin-top:28px}
.photos button{display:block;width:100%;margin:0 0 clamp(14px,1.6vw,24px);padding:0;border:0;background:var(--bg2);break-inside:avoid;overflow:hidden}
.photos img{width:100%;height:auto;transition:transform .6s}
.photos button:hover img{transform:scale(1.03)}
.next{display:block;text-decoration:none;margin-top:clamp(72px,9vw,150px);padding-top:32px;border-top:1px solid var(--line)}
.next b{display:block;font-size:clamp(32px,6vw,96px);font-weight:800;letter-spacing:-.04em;line-height:1;margin-top:12px;transition:color .25s}
.next:hover b{color:var(--teal)}
@media(max-width:700px){.vgrid{grid-template-columns:1fr}}

.modal{position:fixed;inset:0;z-index:100;background:rgba(4,8,10,.95);display:grid;place-items:center;padding:clamp(16px,4vw,56px)}
.modal__x{position:absolute;top:16px;right:16px;display:grid;place-items:center;width:48px;height:48px;background:var(--bg2);border:1px solid var(--line);border-radius:0;font-size:20px;z-index:2}
.modal__x:hover{border-color:var(--teal);color:var(--teal)}
.modal__body{width:min(1280px,100%);max-height:100%}
.modal__body img{max-height:calc(100vh - 120px);width:auto;max-width:100%;margin:0 auto;object-fit:contain}
.modal__nav{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:48px;height:48px;background:var(--bg2);border:1px solid var(--line);border-radius:0;font-size:20px}
.modal__nav:hover{border-color:var(--teal);color:var(--teal)}
.modal__nav--l{left:16px}.modal__nav--r{right:16px}
.modal__cnt{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:var(--muted);font-size:14px}

.js .reveal{opacity:0;transform:translateY(20px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.js .reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .rise,main{animation:none}
  .hero__h .w>span{animation:none;transform:none}
  .hero__stage .glow{animation:none}
  .js .reveal{opacity:1;transform:none;transition:none}
  *{transition-duration:.01ms !important}
}

.adm{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.adm__bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:14px var(--gut);border-bottom:1px solid var(--line);background:var(--bg2)}
.adm__bar .logo{width:150px}
.adm__bar .right{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.adm__body{flex:1;display:grid;grid-template-columns:230px minmax(0,1fr)}
.adm__side{border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:4px;background:var(--bg2)}
.tab{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-radius:0;padding:13px 14px;color:var(--muted);font:500 15px/1 var(--f)}
.tab:hover{color:var(--text);background:var(--bg3)}
.tab[aria-current="page"]{background:var(--bg3);color:var(--teal)}
.adm__main{padding:clamp(24px,4vw,56px) var(--gut);min-width:0}
.adm__main h1{font-size:clamp(28px,3.4vw,46px);font-weight:800;letter-spacing:-.03em;margin-bottom:8px}
.adm__main .lead{color:var(--muted);margin:0 0 32px;max-width:64ch;font-size:16px}
.panel{background:var(--bg2);border:1px solid var(--line);padding:clamp(20px,3vw,32px);margin-bottom:24px}
.panel h2{font-size:18px;letter-spacing:-.01em;margin:0 0 18px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0 16px}
.prow{display:grid;grid-template-columns:96px minmax(0,1.4fr) minmax(0,1fr) minmax(0,.8fr) auto;gap:16px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .th{width:96px;aspect-ratio:16/10;background:var(--bg);overflow:hidden}
.prow .th img{width:100%;height:100%;object-fit:cover}
.prow b{display:block;font-weight:600}
.prow small{color:var(--muted);font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:40px;height:40px;padding:0 12px;background:var(--bg);border:1px solid var(--line);border-radius:0;font-size:16px;color:var(--text);text-decoration:none}
.ib:hover{border-color:var(--teal);color:var(--teal)}
.ib[disabled]{opacity:.35;cursor:not-allowed}
.ib--danger:hover{border-color:var(--danger);color:var(--danger)}
.ib span{font:600 13px/1 var(--f)}
.vrow{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow .th{width:120px;aspect-ratio:16/9;background:var(--bg);overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}
.vrow .th img{width:100%;height:100%;object-fit:cover}
.vrow .fld{margin-bottom:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:16px}
.pitem{background:var(--bg);border:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:8px}
.pitem img{width:100%;aspect-ratio:4/3;object-fit:cover}
.pitem .acts{justify-content:flex-start}
.pitem .ib{min-width:34px;height:34px;padding:0 8px;font-size:14px}
.badge{display:inline-block;font:600 12px/1 var(--f);padding:6px 9px;border:1px solid var(--teal);color:var(--teal)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:28px;border:1px dashed var(--muted);color:var(--muted);text-align:center}
.drop:hover{border-color:var(--teal);color:var(--teal)}
.note{display:flex;gap:12px;padding:16px 18px;background:var(--bg);border:1px solid var(--line);color:var(--muted);font-size:15px;margin-bottom:24px}
.note svg{color:var(--teal);font-size:20px;margin-top:2px}
.note b{color:var(--text)}
.chk{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:16px;color:var(--text)}
.chk input{width:20px;height:20px;accent-color:var(--teal)}
.err{color:var(--danger);font-size:14px;margin-top:6px}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate form{width:min(440px,100%)}
.gate .logo{width:210px;margin-bottom:36px}
.gate h1{font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-.03em;margin-bottom:12px}
.gate p.d{color:var(--muted);margin-bottom:28px}
.toast{position:fixed;right:20px;bottom:20px;z-index:200;background:var(--teal);color:var(--ink);padding:14px 20px;font-weight:600;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.toast--err{background:var(--danger)}
.stk{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:12px;padding:16px 0;background:var(--bg);border-top:1px solid var(--line);margin-top:24px}
@media(max-width:1000px){
  .adm__body{grid-template-columns:1fr}
  .adm__side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:12px var(--gut)}
  .tab{width:auto}
  .prow{grid-template-columns:72px minmax(0,1fr)}
  .prow .th{width:72px}
  .prow .c3,.prow .c4{display:none}
  .prow .acts{grid-column:1/-1;justify-content:flex-start}
  .g2,.g4{grid-template-columns:1fr}
  .vrow{grid-template-columns:1fr}
  .vrow .th{width:100%;max-width:240px}
}

  let q='rel=0&modestbranding=1&playsinline=1&iv_load_policy=3';
  if(o.bg) q+='&autoplay=1&mute=1&controls=0&loop=1&playlist='+id+'&disablekb=1&fs=0';
  if(o.auto) q+='&autoplay=1';
  return 'https://www.youtube-nocookie.com/embed/'+id+'?'+q;
}
const iframe=(id,o,title)=>'<iframe src="'+ytEmbed(id,o)+'" title="'+esc(title||'Vidéo YouTube')+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';

const store=(function(){
  let db=null; const mem={};
  const open=()=>new Promise(res=>{
    try{
      const r=indexedDB.open('manaprod-site',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('kv');
      r.onsuccess=()=>{db=r.result;res(true)};
      r.onerror=()=>res(false); r.onblocked=()=>res(false);
    }catch(e){res(false)}
  });
  const get=k=>new Promise(res=>{
    if(!db) return res(mem[k]);
    try{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)}catch(e){res(undefined)}
  });
  const set=(k,v)=>new Promise(res=>{
    if(!db){mem[k]=v;return res(true)}
    try{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>res(false);t.onabort=()=>res(false)}catch(e){res(false)}
  });
  return{open,get,set};
})();

let S=defaults();
const A={tab:'projets',ed:null,confirm:null,cl:null,tm:null};
let persistOK=true, dirty=false;
async function load(){
  persistOK=await store.open();
  const s=await store.get('settings'), pr=await store.get('projects'), cl=await store.get('clients'), tm=await store.get('team'), dr=await store.get('dirty');
  if(s&&pr){ const d=defaults(); S={settings:Object.assign(d.settings,s),projects:pr,clients:Array.isArray(cl)?cl:d.clients,team:(Array.isArray(tm)&&(tm.length>1||(tm[0]&&tm[0].photo)))?tm:d.team}; dirty=!!dr; }
  else { S=defaults(); await save(true); }
}
async function save(init){
  const a=await store.set('settings',S.settings), b=(await store.set('projects',S.projects))&&(await store.set('clients',S.clients))&&(await store.set('team',S.team));
  if(!(a&&b)) toast('Enregistrement impossible : espace de stockage plein ou bloqué.',true);
  else if(!init){ dirty=true; await store.set('dirty',true); }
  return a&&b;
}
const thumbOf=p=>{
  if(p.thumb) return p.thumb;
  const v=(p.videos||[]).find(v=>v.id); if(v) return ytThumb(v.id);
  return (p.photos&&p.photos[0])||null;
};
const imgTag=(src,alt,extra)=>'<img src="'+esc(src)+'" alt="'+esc(alt)+'" '+(extra||'')+(/^https:\/\/i\.ytimg/.test(src)?ytFix:'')+'>';

function fileToDataUrl(file,max,q,png){
  return new Promise((res,rej)=>{
    const fr=new FileReader(); fr.onerror=rej;
    fr.onload=()=>{
      const img=new Image(); img.onerror=rej;
      img.onload=()=>{
        const k=Math.min(1,max/Math.max(img.width,img.height));
        const w=Math.round(img.width*k), h=Math.round(img.height*k);
        const c=document.createElement('canvas'); c.width=w; c.height=h;
        const x=c.getContext('2d'); if(!png){ x.fillStyle='#10191D'; x.fillRect(0,0,w,h); } x.drawImage(img,0,0,w,h);
        res(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',q));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

let toastT=null;
function toast(msg,isErr){
  $$('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'+(isErr?' toast--err':''); t.setAttribute('role','status'); t.textContent=msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),3800);
}

  switch(act){
    case 'tab': A.tab=el.dataset.tab; A.ed=null; A.confirm=null; A.cl=null; A.tm=null; rerenderAdmin(); break;
    case 'p-new': A.ed={id:uid(),client:'',title:'',category:CATS[0],year:new Date().getFullYear(),context:'',deliverables:[],thumb:null,videos:[],photos:[],featured:false}; rerenderAdmin(); break;
    case 'p-edit': A.ed=clone(S.projects.find(p=>p.id===id)); A.ed.deliverables=A.ed.deliverables||[]; rerenderAdmin(); break;
    case 'p-cancel': A.ed=null; rerenderAdmin(); break;
    case 'p-up': case 'p-down': { const k=S.projects.findIndex(p=>p.id===id); swap(S.projects,k,k+(act==='p-up'?-1:1)); await save(); rerenderAdmin(true); break; }
    case 'p-del': A.confirm=id; rerenderAdmin(true); setTimeout(()=>{ if(A.confirm===id){A.confirm=null; if(!A.ed) rerenderAdmin(true);} },4000); break;
    case 'p-del-ok': S.projects=S.projects.filter(p=>p.id!==id); A.confirm=null; await save(); toast('Projet supprimé.'); rerenderAdmin(true); break;
    case 'v-add': A.ed.videos.push({url:'',title:'',id:''}); $('#vlist').innerHTML=videoRows(); { const last=$$('[data-vf="url"]').pop(); if(last) last.focus(); } break;
    case 'v-del': A.ed.videos.splice(i,1); $('#vlist').innerHTML=videoRows(); $('#thumbBox').innerHTML=thumbBox(); break;
    case 'v-up': swap(A.ed.videos,i,i-1); $('#vlist').innerHTML=videoRows(); $('#thumbBox').innerHTML=thumbBox(); break;
    case 'v-down': swap(A.ed.videos,i,i+1); $('#vlist').innerHTML=videoRows(); $('#thumbBox').innerHTML=thumbBox(); break;
    case 'ph-del': A.ed.photos.splice(i,1); $('#plist').innerHTML=photoGrid(); $('#thumbBox').innerHTML=thumbBox(); break;
    case 'ph-left': swap(A.ed.photos,i,i-1); $('#plist').innerHTML=photoGrid(); break;
    case 'ph-right': swap(A.ed.photos,i,i+1); $('#plist').innerHTML=photoGrid(); break;
    case 'ph-thumb': A.ed.thumb=A.ed.photos[i]; $('#thumbBox').innerHTML=thumbBox(); toast('Miniature définie.'); break;
    case 'thumb-clear': A.ed.thumb=null; $('#thumbBox').innerHTML=thumbBox(); break;
    case 'sr-del': S.settings.showreel={url:'',id:'',title:'Showreel 2026'}; await save(); toast('Showreel retiré.'); rerenderAdmin(true); break;
    case 'c-add': A.cl.push({id:uid(),name:'',logo:null,white:false}); rerenderAdmin(true); { const l=$$('[data-cf="name"]').pop(); if(l) l.focus(); } break;
    case 'c-del': A.cl.splice(i,1); rerenderAdmin(true); break;
    case 'c-up': swap(A.cl,i,i-1); rerenderAdmin(true); break;
    case 'c-down': swap(A.cl,i,i+1); rerenderAdmin(true); break;
    case 'c-logo-clear': A.cl[i].logo=null; A.cl[i].white=false; rerenderAdmin(true); break;
    case 'c-save': S.clients=A.cl.map(c=>({id:c.id,name:(c.name||'').trim(),logo:c.logo||null,white:!!c.white})).filter(c=>c.name||c.logo); A.cl=null; if(await save()) toast('Clients enregistrés.'); rerenderAdmin(true); break;
    case 't-add': A.tm.push({id:uid(),name:'',role:'',bio:'',photo:null}); rerenderAdmin(true); { const l=$$('[data-tf="name"]').pop(); if(l) l.focus(); } break;
    case 't-del': A.tm.splice(i,1); rerenderAdmin(true); break;
    case 't-up': swap(A.tm,i,i-1); rerenderAdmin(true); break;
    case 't-down': swap(A.tm,i,i+1); rerenderAdmin(true); break;
    case 't-photo-clear': A.tm[i].photo=null; rerenderAdmin(true); break;
    case 't-save': S.team=A.tm.map(m=>({id:m.id,name:(m.name||'').trim(),role:(m.role||'').trim(),bio:(m.bio||'').trim(),photo:m.photo||null})).filter(m=>m.name); A.tm=null; if(await save()) toast('Équipe enregistrée.'); rerenderAdmin(true); break;
    case 'export': exportData(); break;
    case 'publish': publish(); break;
    case 'reset': A.confirm='reset'; rerenderAdmin(true); setTimeout(()=>{ if(A.confirm==='reset'){A.confirm=null; rerenderAdmin(true);} },5000); break;
    case 'reset-ok': { S=defaults(); A.confirm=null; A.ed=null; await save(); toast('Site réinitialisé.'); rerenderAdmin(true); break; }
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.cf&&A.cl){ A.cl[+t.dataset.ci][t.dataset.cf]=t.type==='checkbox'?t.checked:t.value; return; }
  if(t.dataset.tf&&A.tm){ A.tm[+t.dataset.ti][t.dataset.tf]=t.value; return; }
  if(!A.ed) return;
  if(t.dataset.dl!==undefined){ A.ed.deliverables=t.value.split('\n'); }
  else if(t.dataset.f){ A.ed[t.dataset.f]=t.type==='checkbox'?t.checked:(t.type==='number'?(+t.value||''):t.value); }
  else if(t.dataset.vf){ const v=A.ed.videos[+t.dataset.vi]; v[t.dataset.vf]=t.value; if(t.dataset.vf==='url') v.id=ytId(t.value)||''; }
});
document.addEventListener('change',async ev=>{
  const t=ev.target;
  if(t.dataset.cf==='white'){ rerenderAdmin(true); return; }
  if(t.dataset.vf==='url'&&A.ed){ $('#vlist').innerHTML=videoRows(); $('#thumbBox').innerHTML=thumbBox(); return; }
  if(t.dataset.f==='client'&&A.ed){ $('#thumbBox').innerHTML=thumbBox(); return; }
  const k=t.dataset.file; if(!k) return;
  const files=Array.from(t.files||[]); if(!files.length) return;
  try{
    if(k==='photos'){
      toast('Traitement des photos...');
      for(const f of files){ A.ed.photos.push(await fileToDataUrl(f,1800,.82)); }
      $('#plist').innerHTML=photoGrid(); $('#thumbBox').innerHTML=thumbBox(); toast(plural(files.length,'photo')+' ajoutée'+(files.length>1?'s':'')+'.');
    } else if(k==='clogo'){
      A.cl[+t.dataset.i].logo=await fileToDataUrl(files[0],520,.9,true); rerenderAdmin(true);
    } else if(k==='tphoto'){
      A.tm[+t.dataset.i].photo=await fileToDataUrl(files[0],1000,.86); rerenderAdmin(true);
    } else if(k==='thumb'){
      A.ed.thumb=await fileToDataUrl(files[0],1280,.84); $('#thumbBox').innerHTML=thumbBox();
    } else if(k==='import'){
      importData(files[0]);
    }
  }catch(e){ toast('Impossible de lire ce fichier.',true); }
  t.value='';
});
document.addEventListener('submit',async ev=>{
  const f=ev.target; ev.preventDefault();
  if(f.id==='srform'){
    const url=$('#sr-u').value.trim(), title=$('#sr-t').value.trim()||'Showreel';
    const id=ytId(url);
    if(url&&!id){ $('#sr-err').textContent='Ce lien n’est pas reconnu comme une vidéo YouTube.'; return; }
    S.settings.showreel={url:url,id:id||'',title:title}; await save(); toast('Showreel enregistré.'); rerenderAdmin(true);
  }
  else if(f.id==='pform'){
    const e=A.ed, err=$('#p-err');
    if(!(e.client||'').trim()&&!(e.title||'').trim()){ err.textContent='Renseignez au moins le client ou le titre.'; return; }
    const bad=e.videos.find(v=>v.url&&!ytId(v.url));
    if(bad){ err.textContent='Un des liens vidéo n’est pas un lien YouTube valide. Corrigez-le ou supprimez la ligne.'; return; }
    e.videos=e.videos.filter(v=>ytId(v.url)).map(v=>({id:ytId(v.url),url:v.url.trim(),title:(v.title||'').trim()}));
    e.deliverables=(e.deliverables||[]).map(x=>x.trim()).filter(Boolean);
    e.client=(e.client||'').trim(); e.title=(e.title||'').trim(); e.year=e.year||new Date().getFullYear();
    const k=S.projects.findIndex(p=>p.id===e.id);
    if(k>-1) S.projects[k]=clone(e); else S.projects.push(clone(e));
    if(await save()){ toast('Projet enregistré.'); A.ed=null; rerenderAdmin(); window.scrollTo(0,0); }
  }
  else if(f.id==='setform'){
    const d=new FormData(f), st=S.settings;
    st.heroTitle=d.get('heroTitle').toString().trim()||st.heroTitle; st.heroSub=d.get('heroSub').toString().trim();
    st.stats=st.stats.map((s,i)=>({n:d.get('n'+i).toString().trim(),l:d.get('l'+i).toString().trim()}));
    st.phone=d.get('phone').toString().trim(); st.email=d.get('email').toString().trim(); st.city=d.get('city').toString().trim(); st.reply=d.get('reply').toString().trim();
    await save(); toast('Réglages enregistrés.'); rerenderAdmin(true);
  }
});

function download(name,text,type){
  const blob=new Blob([text],{type:type}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function publish(){
  download('manaprod-data.js','window.MANA_DATA='+JSON.stringify(dataObject())+';\n','text/javascript');
  dirty=false; await store.set('dirty',false); toast('manaprod-data.js téléchargé. Placez-le à côté du site.'); rerenderAdmin(true);
}
function exportData(){
  download('manaprod-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(dataObject()),'application/json'); toast('Sauvegarde téléchargée.');
}
function importData(file){
  const fr=new FileReader(); const err=$('#imp-err');
  fr.onload=async()=>{
    try{
      const txt=String(fr.result).replace(/^\s*window\.MANA_DATA\s*=\s*/,'').replace(/;\s*$/,'');
      const d=JSON.parse(txt);
      if(!d||d.app!=='manaprod-site'||!Array.isArray(d.projects)||!d.settings) throw new Error('format');
      const base=defaults().settings;
      S.settings=Object.assign(base,d.settings);
      S.projects=d.projects.map(p=>({id:p.id||uid(),client:p.client||'',title:p.title||'',category:p.category||CATS[0],year:p.year||2026,context:p.context||'',deliverables:Array.isArray(p.deliverables)?p.deliverables.filter(Boolean).map(String):[],thumb:p.thumb||null,featured:!!p.featured,videos:(p.videos||[]).filter(v=>ytId(v.url)).map(v=>({id:ytId(v.url),url:v.url,title:v.title||''})),photos:Array.isArray(p.photos)?p.photos:[]}));
      if(Array.isArray(d.clients)) S.clients=d.clients.map(c=>({id:c.id||uid(),name:c.name||'',logo:c.logo||null,white:!!c.white}));
      if(Array.isArray(d.team)) S.team=d.team.map(m=>({id:m.id||uid(),name:m.name||'',role:m.role||'',bio:m.bio||'',photo:m.photo||null}));
      await save(); toast('Fichier importé.'); rerenderAdmin(true);
    }catch(e){ if(err) err.textContent='Ce fichier n\u2019est pas valide pour ce site.'; }
  };
  fr.readAsText(file);
}

load().then(()=>rerenderAdmin());
})();
</script>
</body>
